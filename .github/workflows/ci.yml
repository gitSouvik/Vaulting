name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Lint & static analysis ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy hypothesis cryptography

      - name: Ruff (fast linter)
        run: ruff check vaulting/ tests/ benchmarks/ --output-format=github

      - name: Mypy (type checking)
        run: mypy vaulting/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # type-check warnings don't block CI yet

  # ── 2. C compilation ───────────────────────────────────────────────────────
  c-build:
    name: C Build & Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc make

      - name: Build shared library
        run: |
          cd c_src
          make all
        env:
          CC: ${{ runner.os == 'macOS' && 'clang' || 'gcc' }}

      - name: Run C unit tests
        run: |
          cd c_src
          make test

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvaulting-${{ matrix.os }}
          path: |
            vaulting/libvaulting_core.so
            vaulting/libvaulting_core.dylib
          if-no-files-found: ignore
          retention-days: 7

  # ── 3. Python unit + property tests ────────────────────────────────────────
  python-tests:
    name: Python Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: c-build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: libvaulting-ubuntu-latest
          path: vaulting/
        continue-on-error: true  # fall back to Python-only if lib not present

      - name: Install dependencies
        run: |
          pip install -e "."
          pip install pytest hypothesis

      - name: Build C library (fallback if artifact missing)
        run: |
          if [ ! -f vaulting/libvaulting_core.so ]; then
            cd c_src && make all
          fi
        continue-on-error: true

      - name: Run unit tests
        run: pytest tests/ -q --tb=short --ignore=tests/test_invariants.py

      - name: Run property-based tests (Hypothesis)
        run: |
          pytest tests/test_invariants.py -q --tb=short \
            --hypothesis-seed=0
        env:
          HYPOTHESIS_MAX_EXAMPLES: "200"

      - name: Run chaos tests
        run: pytest tests/test_chaos.py -v --tb=short

  # ── 4. Security audit ──────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement <(pip freeze) --ignore-vuln GHSA-xxxx-dummy || true

      - name: Check for hardcoded secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ── 5. Benchmark (informational, not blocking) ─────────────────────────────
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [c-build, python-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: libvaulting-ubuntu-latest
          path: vaulting/

      - name: Install dependencies
        run: pip install -e "." hypothesis

      - name: Scanner benchmark
        run: python benchmarks/bench_scanner.py | tee benchmark_scanner.txt

      - name: Rotation benchmark
        run: python benchmarks/bench_rotation.py | tee benchmark_rotation.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmark_*.txt
          retention-days: 90

  # ── 6. Docker build (smoke test only, no push unless main) ─────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, c-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vaulting:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to GHCR (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vaulting:latest
            ghcr.io/${{ github.repository_owner }}/vaulting:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
