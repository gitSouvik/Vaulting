version: "3.9"

# ─────────────────────────────────────────────────────────────
#  Vaulting — full observability stack
#  docker compose up
# ─────────────────────────────────────────────────────────────

services:

  # ── Vaulting server ─────────────────────────────────────────
  vaulting:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaulting:latest
    container_name: vaulting
    restart: unless-stopped
    environment:
      VAULTING_DB:          /data/vault.db
      VAULTING_METRICS_PORT: "9101"
      VAULTING_LOG_LEVEL:   "INFO"
      # Unseal configuration (override via env or secret manager)
      VAULTING_UNSEAL_THRESHOLD: "3"
      VAULTING_UNSEAL_SHARES:    "5"
    volumes:
      - vaulting_data:/data
      - ./tls:/tls:ro          # mTLS certificates (optional)
    ports:
      - "8080:8080"            # HTTP API
      - "9101:9101"            # Prometheus /metrics
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout:  5s
      retries:  3

  # ── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - vaulting

  # ── Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vaulting.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  vaulting_data:
  prometheus_data:
  grafana_data:
